
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  linting-and-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest -v
